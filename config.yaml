classes:
  - unripe
  - early_ripening
  - ripe
  - overripe
  - rotten

queries:
  unripe:
    - "pepaya california mentah hijau"
    - "buah pepaya california muda hijau"
    - "pepaya calina mentah"
    - "california papaya unripe green whole fruit"
  early_ripening:
    - "pepaya california mengkal kuning hijau"
    - "buah pepaya california setengah matang"
    - "pepaya calina mengkal"
    - "california papaya half ripe turning yellow"
  ripe:
    - "pepaya california matang"
    - "buah pepaya california matang utuh"
    - "pepaya calina matang"
    - "ripe california papaya whole fruit"
  overripe:
    - "pepaya california terlalu matang"
    - "buah pepaya california kelewat matang"
    - "overripe california papaya fruit"
    - "california papaya overripe soft"
  rotten:
    - "pepaya california busuk"
    - "buah pepaya california busuk berjamur"
    - "rotten california papaya fruit"
    - "moldy spoiled california papaya"

scraper:
  output_dir: "data/raw"
  per_class: 0 # 0 = unlimited (ambil dari semua query & semua sumber)
  per_query_limit: 100 # maks kandidat per query per sumber saat unlimited
  min_size: [320, 320]
  delay: 1.0
  threads: 4
  sources:
    - "bing"
    - "google"
    - "duckduckgo"
    - "unsplash"
    - "wikimedia"
    - "inaturalist"
    - "pixabay"
    - "flickr"
    - "serper"
  # API keys can be set here or in .env (UNSPLASH_ACCESS_KEY, PEXELS_API_KEY,
  # PIXABAY_API_KEY, FLICKR_API_KEY, SERPER_API_KEY). Sources without a key are skipped.
  unsplash_access_key: ""
  pexels_api_key: ""
  pixabay_api_key: ""
  flickr_api_key: ""
  serper_api_key: ""
  max_retries: 3
  respect_robots: true

cleaner:
  input_dir: "data/raw"
  output_dir: "data/clean"
  min_size: [320, 320]
  phash_threshold: 8
  clip_model: "openai/clip-vit-base-patch32"
  clip_threshold: 0.6
  device: "auto"

annotator:
  input_dir: "data/clean"
  output_dir: "data/annotated"
  detector: "grounding-dino" # grounding-dino | owlvit
  detector_model: "IDEA-Research/grounding-dino-tiny"
  clip_model: "openai/clip-vit-base-patch32"
  prompt: "papaya"
  conf_threshold: 0.4
  preview: true
  device: "auto"

exporter:
  input_dir: "data/annotated"
  output_dir: "data/export"
  format: "yolo" # yolo | coco | voc | all
  split: [70, 20, 10]
  seed: 42
  verified_only: false
